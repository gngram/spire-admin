<!DOCTYPE html>
<html>
<head>
    <title>Login - SPIRE Admin</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div class="card" style="width: 320px; text-align: center;">
        <h2>Login</h2>

        <div id="oidc-section" style="display: none; margin-bottom: 15px;">
            <button onclick="loginOIDC()" style="width: 98%; background-color: #2f2f2f; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
                Sign in with Microsoft
            </button>
            <div style="display: flex; align-items: center; margin: 15px 0; color: #888;">
                <hr style="flex: 1; border: none; border-top: 1px solid #ccc;">
                <span style="padding: 0 10px; font-size: 12px;">OR</span>
                <hr style="flex: 1; border: none; border-top: 1px solid #ccc;">
            </div>
        </div>

        <input type="text" id="username" placeholder="Username" style="width: 90%; margin-bottom: 10px;"><br>
        <input type="password" id="password" placeholder="Password" style="width: 90%; margin-bottom: 15px;"><br>
        <button onclick="doLogin()" style="width: 98%;">Sign In</button>
        <p id="err" class="error"></p>
    </div>
    <script src="js/app.js"></script>
    <script>
        if (getToken()) window.location.href = 'dashboard.html';

        async function checkProviders() {
            try {
                const res = await fetch('/api/auth/providers');
                if (res.ok) {
                    const data = await res.json();
                    if (data.oidc_enabled) {
                        document.getElementById('oidc-section').style.display = 'block';
                    }
                }
            } catch (e) {
                console.error("Failed to query auth providers:", e);
            }
        }
        checkProviders();

        function loginOIDC() {
            window.location.href = '/api/auth/oidc/login';
        }

        async function doLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if (res.ok) {
                setToken(data.token);
                sessionStorage.setItem('spire_admin', data.is_admin);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('err').innerText = data.error;
            }
        }
    </script>
</body>
</html>
